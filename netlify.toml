# Netlify serves only the page (HTML, CSS, JS, images).
# Every /api/... call is forwarded to the Python server on Render.
[build]
  publish = "app/static"
  command = ""

# Page, JS and CSS are always checked with the server, so browsers never keep an old version.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Replace the address below if Render gives your service a different one.
[[redirects]]
  from = "/api/*"
  to = "https://xikomo-api.onrender.com/api/:splat"
  status = 200
  force = true
